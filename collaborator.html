<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A private look | A Brighter Humanity</title>
<script>try { if (sessionStorage.getItem('abh-collaborator')) document.documentElement.classList.add('resuming'); } catch (e) {}</script>
<meta name="description" content="A private page about Abigail Tracey and A Brighter Humanity.">
<meta name="theme-color" content="#CDEFDC">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<style>
/* A standalone page: it does not load site.js, so it never redirects into a modal.
   The content is sealed below and only opens with the password. See scripts/seal-collaborator.mjs. */
@font-face{font-family:"Bodoni Moda";src:url(assets/fonts/bodoni-moda-latin-wght-italic.woff2) format("woff2");font-weight:400 900;font-style:italic;font-display:swap}
@font-face{font-family:"Bodoni Moda";src:url(assets/fonts/bodoni-moda-latin-wght-normal.woff2) format("woff2");font-weight:400 900;font-style:normal;font-display:swap}
@font-face{font-family:"Alfa Slab One";src:url(assets/fonts/alfa-slab-one-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url(assets/fonts/bricolage-grotesque-latin-wght-normal.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"DM Sans";src:url(assets/fonts/dm-sans-latin-wght-normal.woff2) format("woff2");font-weight:100 1000;font-display:swap}
:root{
  --night:#17382E;--rose:#D81F5F;--butter:#FFD15C;--ivory:#FFF6E6;--card:#FFFDF5;
  --ease:cubic-bezier(0.23,1,0.32,1);
  --serif:"Bodoni Moda",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif;--display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
  --gut:clamp(16px,5vw,64px);
}
*{box-sizing:border-box}
html{overflow-x:clip;scroll-behavior:smooth}
body{margin:0;background:var(--ivory);color:var(--night);font:400 1.0625rem/1.6 var(--sans);overflow-x:clip}
img{display:block;max-width:100%;height:auto}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:1.02;margin:0;text-wrap:balance}
h1 em,h2 em{font:italic 500 1em/1 var(--serif);letter-spacing:-.01em;color:var(--rose)}
h2{font-size:clamp(2.2rem,5.6vw,4.4rem)}
h3{font-size:1.3rem;letter-spacing:-.015em}
p{margin:0 0 1em}
a{color:inherit}
:focus-visible{outline:3px solid var(--butter);outline-offset:3px;box-shadow:0 0 0 6px var(--night)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.pill{display:inline-block;background:var(--night);color:var(--ivory);font:700 .86rem/1 var(--sans);padding:.6em 1em;border-radius:99px;margin-bottom:1.1em}

/* ---------- The gate: morning sky, hills, the sun coming up ---------- */
.gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px 16px 150px;overflow:hidden;background:linear-gradient(180deg,#CDEFDC,#F4F3C2)}
.gate-sun{position:absolute;right:12%;bottom:120px;width:clamp(120px,18vw,210px);aspect-ratio:1;border-radius:50%;background:radial-gradient(#FFE9A8 52%,#FFD15C 53% 70%,rgba(255,209,92,0) 71%);animation:rise 10s var(--ease) both}
.gate-hills{position:absolute;inset:auto 0 0;height:clamp(110px,16vw,190px)}
.gate-hills svg{width:100%;height:100%}
.gate-card{position:relative;z-index:1;width:min(440px,100%);background:var(--card);border-radius:32px;padding:clamp(26px,5vw,40px);text-align:center;box-shadow:0 24px 50px -30px rgba(23,56,46,.5);animation:lift 900ms var(--ease) 200ms both}
.gate-card .logo{width:min(280px,80%);margin:0 auto 22px}
.gate-card h1{font-size:clamp(2rem,6vw,2.6rem);margin-bottom:.35em}
.gate-card p{margin:0 0 1.2em;font-size:1rem}
.gate-form{display:grid;gap:12px}
.gate-form input{width:100%;min-height:52px;border:0;border-radius:99px;padding:0 1.3em;font:500 1.05rem var(--sans);color:var(--night);background:#fff;box-shadow:inset 0 0 0 1.5px rgba(23,56,46,.18)}
.gate-form input:focus-visible{box-shadow:inset 0 0 0 2px var(--night);outline:none}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:5.2em}
.gate-form .pw-show{position:absolute;right:7px;top:50%;translate:0 -50%;min-height:38px;padding:0 14px;border:0;border-radius:99px;background:rgba(23,56,46,.08);color:var(--night);font:700 .85rem var(--sans);cursor:pointer}
.gate-form .pw-show:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.gate-form .pw-show:hover{transform:none;background:rgba(23,56,46,.14)}}
.gate-back{display:inline-block;margin-top:6px;font-size:.92rem;font-weight:600;text-underline-offset:3px}
.gate-msg{min-height:1.5em;margin:12px 0 0!important;font-size:.95rem!important;color:var(--rose);font-weight:600}
.gate.is-open{animation:gate-off 380ms ease forwards}
.gate[hidden]{display:none}
/* Coming back in this visit: keep the sign-in hidden while the page reopens, so it never flashes. */
.resuming .gate > *{visibility:hidden}

.a-btn,.gate-form button[type=submit]{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:.85em 1.6em;border:0;border-radius:99px;background:var(--rose);color:#fff;font:700 1.02rem/1.1 var(--sans);text-decoration:none;cursor:pointer;transition:transform 180ms var(--ease)}
.a-btn:active,.gate-form button[type=submit]:active{transform:scale(.97)}
.gate-form button[type=submit][disabled]{opacity:.7;cursor:progress}
@media (hover:hover) and (pointer:fine){.a-btn:hover,.gate-form button[type=submit]:hover{transform:translateY(-2px)}}

/* ---------- The page, once open ---------- */
.sealed-page[hidden]{display:none}
.a-top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px var(--gut);background:rgba(246,250,238,.96);box-shadow:0 1px 0 rgba(23,56,46,.06)}
.a-top img{height:22px;width:auto;max-width:62vw;object-fit:contain}
.a-top button{border:0;background:none;color:var(--night);font:600 .9rem var(--sans);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 2px;white-space:nowrap;flex:none}
@property --p{syntax:"<number>";inherits:true;initial-value:0}

/* Pages stack. Each one sticks when its bottom reaches the screen (top is set in JS),
   and the next pulls up over it. --c is how far it has been covered, 0 to 1.
   No dimming veil: repainting a full-screen overlay every frame made scrolling stutter. */
[data-content]{position:relative;z-index:1}
.page{position:sticky;top:0;min-height:100vh;min-height:100svh;margin-bottom:var(--hold,0);padding:clamp(80px,11vw,140px) 0;border-radius:44px 44px 0 0;overflow:clip;box-shadow:0 -24px 50px -30px rgba(23,56,46,.35);transform:scale(calc(1 - var(--c,0) * .03));will-change:transform}
/* How each page leaves as the next covers it. */
.out-lift{transform:translateY(calc(var(--c,0) * -7vh)) scale(calc(1 - var(--c,0) * .02))}
.out-tilt{transform:translateY(calc(var(--c,0) * -3vh)) scale(calc(1 - var(--c,0) * .07))}
.out-side{transform:translateX(calc(var(--c,0) * -6%)) scale(calc(1 - var(--c,0) * .04))}
.out-blur{transform:translateY(calc(var(--c,0) * 4vh)) scale(calc(1 - var(--c,0) * .05))}
.out-fade{transform:scale(calc(1 - var(--c,0) * .06))}
.page:not(.a-hero){display:grid;align-content:center}
/* On computers every page is exactly one screen below the top bar, so it locks whole. JS shrinks (zoom) anything that wouldn't fit. */
.pin .page:not(.a-hero){height:100vh;height:100svh;min-height:0;padding:calc(var(--head,54px) + 20px) 0 20px}
.page:first-child{border-radius:0;box-shadow:none}
.scene{position:relative;height:var(--len);background:var(--ivory)}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:clip}
.wrap{max-width:1180px;margin:auto;padding:0 var(--gut)}
.wrap-narrow{max-width:820px}
.wrap-wide{max-width:1400px}
.wrap > h2{margin-bottom:.6em}
.a-intro{max-width:40em;font-size:clamp(1.15rem,1.8vw,1.35rem);margin-top:-.6em}

/* Every timed piece: --t runs 0 to 1 across its window [--a, --b] of the scene's --p, eased out. */
.wq .w,.wq footer,.h-you,.h-abi,.half p,.m-star,.m-cap{--t:clamp(0,(var(--p) - var(--a,0)) / (var(--b,1) - var(--a,0)),1);--e:calc(1 - (1 - var(--t)) * (1 - var(--t)))}

/* ---------- Hero ---------- */
.a-hero{text-align:center;padding:clamp(28px,5vw,60px) var(--gut) clamp(150px,17vw,210px);background:linear-gradient(180deg,#CDEFDC,#F4F3C2)}
.a-sub{max-width:34em;margin:.8em auto 1.8em;font-size:clamp(1.15rem,2vw,1.35rem)}
.a-scroll{position:relative;z-index:1;display:inline-flex;flex-direction:column;align-items:center;gap:6px;margin-top:clamp(34px,5vw,56px);text-decoration:none}
.a-scroll-big{font:italic 600 clamp(2.2rem,6vw,4.4rem)/1 var(--serif);color:var(--rose);letter-spacing:-.01em}
.a-scroll-small{font:800 clamp(1.15rem,2.4vw,1.7rem)/1.1 var(--display);letter-spacing:-.02em}
.a-scroll i{width:54px;height:54px;margin-top:14px;border-radius:50%;background:var(--night);position:relative;animation:nudge 2.8s ease-in-out infinite}
.a-scroll i::before{content:"";position:absolute;left:50%;top:44%;width:14px;height:14px;border:solid var(--butter);border-width:0 3px 3px 0;transform:translate(-50%,-50%) rotate(45deg)}
.a-hero .hills{position:absolute;inset:auto 0 0;height:clamp(90px,13vw,150px);pointer-events:none}
.a-hero .hills svg{width:100%;height:100%}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

/* The film sits in a window, painted like the site's frames: warm wood, a maroon inner line and ivory beads, with a flowering vine climbing two corners. */
.window{position:relative;z-index:1;max-width:1000px;margin:0 auto 30px;padding:clamp(10px,1.7vw,20px);background:#D79A62;border-radius:24px;box-shadow:0 30px 60px -34px rgba(23,56,46,.6)}
.window::before{content:"";position:absolute;inset:clamp(4px,.7vw,8px);border:2.5px dotted #FFF6E6;border-radius:18px;pointer-events:none}
.sprig{position:absolute;z-index:2;width:clamp(130px,21vw,280px);pointer-events:none}
.sprig svg{display:block;width:100%;height:auto;overflow:visible}
/* The vine's corner sits on the frame's corner: 44 of 260 in the drawing. */
.sprig-tl{left:0;top:0;translate:-17% -17%}
.sprig-br{right:0;bottom:0;translate:17% 17%;rotate:180deg}
.sprig svg{transform-origin:17% 17%;animation:sway 7s ease-in-out infinite alternate}
.sprig-br svg{animation-delay:-3.5s}
@keyframes sway{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
.film{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--card);box-shadow:0 0 0 2px #7C1D3B}
.film img,.film video,.film iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.film img{filter:brightness(1.06) saturate(.94) contrast(.96)}
.film-video{z-index:2;background:#000;transition:opacity 1000ms ease}
.film-video.is-fading{opacity:0}
.film-play{transition:opacity 1000ms ease}
.film.is-playing .film-play{opacity:0;pointer-events:none}
.film-play{position:absolute;inset:0;z-index:1;display:grid;place-content:center;justify-items:center;gap:clamp(8px,1.4vw,18px);border:0;padding:0;cursor:pointer;background:rgba(255,246,230,.35) url(assets/img/film-poster-soft.jpg) center/cover}
/* "Play me" fades slowly in and out across the picture. */
.film-word{will-change:opacity;font:400 clamp(3.4rem,12vw,9.5rem)/.9 "Alfa Slab One",serif;color:var(--rose);text-transform:uppercase;letter-spacing:.01em;text-shadow:4px 4px 0 var(--butter);animation:breathe 3s ease-in-out infinite}
.film-play i{position:relative;width:clamp(54px,6vw,76px);aspect-ratio:1;border-radius:50%;background:var(--night);animation:breathe 3s ease-in-out infinite}
.film-play i::after{content:"";position:absolute;left:55%;top:50%;translate:-50% -50%;border-style:solid;border-width:11px 0 11px 17px;border-color:transparent transparent transparent var(--butter)}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@media (hover:hover) and (pointer:fine){.film-play:hover .film-word,.film-play:hover i{animation-play-state:paused;opacity:1}}
.film-soon{position:absolute;z-index:2;left:50%;bottom:18px;transform:translateX(-50%);white-space:nowrap;background:rgba(255,253,245,.94);color:var(--night);font:700 .9rem var(--sans);padding:.6em 1.1em;border-radius:99px}

/* The name sign. The bulbs chase and the name flashes. */
.sign-wrap{position:relative;z-index:1;max-width:900px;margin:0 auto clamp(18px,3vw,34px)}
.marquee{width:100%;height:auto;overflow:visible}
.marquee .bulbs-a{animation:bulb .5s steps(1) infinite}
.marquee .bulbs-b{animation:bulb .5s steps(1) infinite -.25s}
.marquee .loud-name{animation:loud 1s steps(1) infinite}
.marquee .twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite alternate}
.marquee .t2{animation-delay:-.5s}.marquee .t3{animation-delay:-1s}
@keyframes bulb{0%{opacity:1}50%{opacity:.12}}
@keyframes loud{0%{fill:#FFD15C}50%{fill:#FF9FB8}}
@keyframes twinkle{from{transform:scale(.7);opacity:.6}to{transform:scale(1.1);opacity:1}}

/* ---------- Letter ---------- */
.p-letter{background:var(--ivory);display:grid;align-items:center}
.letter{position:relative;background:var(--card);border-radius:28px;padding:clamp(28px,5vw,60px);box-shadow:0 30px 60px -34px rgba(23,56,46,.55);font:400 clamp(1.15rem,2vw,1.35rem)/1.6 var(--sans)}
.letter::before{content:"✦";position:absolute;top:-18px;left:50%;translate:-50% 0;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--butter);font-size:1.05rem}
.letter-hi,.letter-sign{font:italic 500 clamp(1.7rem,3.2vw,2.3rem)/1.2 var(--serif);color:var(--rose)}
.letter-sign{margin:1.2em 0 0!important}

/* ---------- Scene: the quote, word by word ---------- */
.s-quote .stage{display:grid;place-content:center;justify-items:center;text-align:center;padding:0 var(--gut);background:linear-gradient(180deg,#FFF6E6,#FFE3EA)}
.wq{margin:0;max-width:1100px}
.wq p{font:italic 500 clamp(2.6rem,7.4vw,6.6rem)/1.02 var(--serif);color:var(--rose);margin:0 0 .5em;letter-spacing:-.015em}
.wq .w{display:inline-block;opacity:calc(.12 + .88 * var(--e));transform:translateY(calc((1 - var(--e)) * .08em))}
.wq footer{--a:.82;--b:.97;font-weight:600;font-size:1.05rem;opacity:var(--e)}

/* ---------- Scene: you and Abigail, side by side ---------- */
.s-mirror .stage{display:grid;grid-template-columns:1fr 1fr;background:var(--ivory)}
.half{display:grid;grid-template-rows:1fr auto 1fr;padding:calc(54px + 3vh) clamp(24px,5vw,80px) 3vh}
/* The names sit on the middle line, level with the star; each line of story hangs beneath its name. */
.half .giant{grid-row:2}
.half p{grid-row:3;align-self:start;margin-top:clamp(14px,2vw,26px)!important}
.h-you{--a:0;--b:.42;background:linear-gradient(160deg,#FFF9CF,#FFE7A6);transform:translateX(calc((1 - var(--e)) * -70%));text-align:center;justify-items:center}
.h-abi{--a:.1;--b:.52;text-align:center;justify-items:center;background:linear-gradient(200deg,#FFE3EA,#FFC7D4);transform:translateX(calc((1 - var(--e)) * 70%))}
.giant{font:400 clamp(3rem,7.4vw,8.4rem)/.9 "Alfa Slab One",serif;text-transform:uppercase;color:var(--night);letter-spacing:.01em}
.h-abi .giant{color:var(--rose)}
.half p{--a:.5;--b:.72;max-width:15em;margin:0;font:700 clamp(1.25rem,2.2vw,1.85rem)/1.3 var(--display);letter-spacing:-.02em;opacity:var(--e)}
.h-abi p{--a:.58;--b:.8}
.m-star{--a:.4;--b:.6;position:absolute;left:50%;top:calc(50% + 27px);width:clamp(70px,9vw,120px);aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:var(--night);color:var(--butter);font-size:clamp(2rem,4vw,3.2rem);box-shadow:0 0 0 10px var(--ivory);opacity:var(--e);transform:translate(-50%,-50%) scale(calc(.85 + var(--e) * .15))}
.m-cap{--a:.82;--b:.98;position:absolute;left:0;right:0;bottom:clamp(24px,6vh,60px);margin:0;text-align:center;font:italic 500 clamp(1.4rem,2.6vw,2.2rem)/1.2 var(--serif);opacity:var(--e)}

/* ---------- The ticket ---------- */
.p-ticket{background:linear-gradient(180deg,#E7F4EE,#FFF9CF);display:grid;align-items:center}
.ticket{display:grid;grid-template-columns:1fr 150px;max-width:900px;margin:auto;border-radius:30px;overflow:hidden;background:var(--card);box-shadow:0 26px 60px -36px rgba(23,56,46,.6)}
.ticket-main{padding:clamp(22px,3.2vw,38px)}
.t-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.t-ox{display:block;width:clamp(130px,14vw,170px);height:auto}
.ticket-kicker{display:inline-block;margin:0!important;background:var(--butter);font:700 .82rem/1 var(--sans);padding:.6em 1em;border-radius:99px}
.ticket h2{font-size:clamp(1.8rem,3.4vw,2.8rem);margin-bottom:.3em}
.t-admit{margin:0 0 .1em!important;font:700 .76rem/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
.t-name{margin:0 0 .45em!important;font:400 clamp(1.6rem,3vw,2.3rem)/1.05 "Alfa Slab One",serif;color:var(--night)}
.t-copy{margin:0 0 1em!important}
.t-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.ticket-when{margin:0!important;font:italic 500 1.2rem/1.3 var(--serif);color:var(--rose)}
.ticket-stub{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 12px;background:#002147;color:#fff;text-align:center;border-left:3px dashed var(--card)}
.ticket-stub span{font:700 .8rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--butter)}
.ticket-stub span,.ticket-stub small{white-space:nowrap}
.ticket-stub small{font:700 .68rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--butter);opacity:.85}
.ticket-stub b{font:400 1.3rem/1.15 "Alfa Slab One",serif;writing-mode:vertical-rl;rotate:180deg}


/* ---------- Guests: two cards, photo beside the words, short enough to lock on one screen ---------- */
.p-guests{background:linear-gradient(180deg,#E3F5EC,#CDEFDC)}
.p-guests h2,.p-talks h2{font-size:clamp(2.2rem,4.6vw,3.8rem)}
.a-head-guests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2.4vw,26px);margin-top:clamp(20px,3vh,34px)}
.g-card{display:grid;grid-template-columns:clamp(110px,11vw,150px) 1fr;gap:0 clamp(16px,2vw,26px);align-items:start;background:var(--card);border-radius:30px;padding:clamp(20px,2.4vw,30px);box-shadow:0 30px 60px -36px rgba(23,56,46,.5)}
.g-pic{aspect-ratio:3/4;border-radius:999px 999px 20px 20px;overflow:hidden}
.g-pic img{width:100%;height:100%;object-fit:cover;filter:brightness(1.05) saturate(.95)}
.g-pic + .g-credit{grid-column:1;margin-top:8px!important;min-height:2.6em}
.g-body{grid-column:2;grid-row:1 / span 2}
.g-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.g-logo{display:grid;place-items:center;height:46px;width:min(160px,70%);padding:6px 12px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1.5px rgba(23,56,46,.1)}
.g-logo img{max-height:34px;width:auto;max-width:100%}
.g-tag{display:inline-flex;align-items:center;gap:7px;margin:0!important;padding:.55em .95em;border-radius:99px;font:800 .78rem/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;animation:on-air 1.2s steps(1) infinite}
.g-tag::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
/* An on-air sign: it switches between butter and lit rose, with a glow when lit. */
@keyframes on-air{0%{background:var(--butter);color:var(--night);box-shadow:none}50%{background:var(--rose);color:#fff;box-shadow:0 0 0 3px rgba(216,31,95,.18),0 0 16px rgba(216,31,95,.55)}}
.g-card h3{font-size:clamp(1.25rem,1.9vw,1.6rem);margin-bottom:.25em;white-space:nowrap}
.g-role{font-weight:700;color:var(--rose);line-height:1.35;font-size:.95rem;margin-bottom:.6em!important}
.g-role{font-size:clamp(.8rem,.95vw,.95rem)!important;min-height:2.7em}
.g-role span{display:block;white-space:nowrap}
.g-ep{font:italic 500 clamp(1.15rem,1.6vw,1.4rem)/1.2 var(--serif);margin-bottom:.5em!important;min-height:2.4em}
.g-blurb{font-size:.95rem;line-height:1.5;margin:0!important;min-height:4.5em}
/* Matching cards always match: each block reserves the same lines (role 2, talk 2, blurb 3, credit 2), so text sits at the same height on every card. */
.g-credit{font-size:.7rem;line-height:1.3;opacity:.6;margin:0!important}

/* ---------- In talks: three compact cards ---------- */
.p-talks{background:linear-gradient(180deg,#FFF0F3,#FFE3EA)}
.p-talks .a-intro{margin-top:-.3em}
.talks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.6vw,18px);margin-top:clamp(18px,2.6vh,30px)}
.talk{display:grid;grid-template-columns:clamp(84px,7.4vw,110px) 1fr;gap:6px clamp(14px,1.4vw,20px);align-items:start;background:var(--card);border-radius:26px;padding:clamp(16px,1.8vw,22px);box-shadow:0 24px 50px -34px rgba(23,56,46,.45)}
.talk-pic{grid-row:1 / span 2;aspect-ratio:3/4;border-radius:999px 999px 14px 14px;overflow:hidden}
.talk-pic img{width:100%;height:100%;object-fit:cover;filter:brightness(1.05) saturate(.95)}
.talk-theme{display:inline-block;margin:0 0 6px!important;padding:.35em .75em;border-radius:99px;background:var(--night);color:var(--butter);font:700 .74rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.talk h3{font-size:clamp(1rem,1.2vw,1.12rem);line-height:1.2;margin-bottom:.15em;min-height:2.4em}
.talk-role{font-size:.85rem;line-height:1.35;opacity:.75;margin:0 0 .45em!important;min-height:2.7em}
.talk-ep{font:italic 500 clamp(1.05rem,1.35vw,1.25rem)/1.2 var(--serif);color:var(--rose);margin:0!important;min-height:2.4em}
.talk .g-credit{grid-column:2;align-self:end;min-height:2.6em}

/* ---------- A whole world: a bento of what exists, unveiled tile by tile once the page has locked ---------- */
.p-built{background:linear-gradient(180deg,#FFF6E6,#FCEBD9)}
.p-built h2{font-size:clamp(2.2rem,4.6vw,3.8rem)}
.world{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto auto;gap:clamp(12px,1.6vw,20px);margin-top:clamp(18px,3vh,32px)}
.w-tile{position:relative;overflow:hidden;border-radius:28px;background:var(--card);padding:clamp(18px,2.2vw,28px);box-shadow:0 24px 50px -34px rgba(23,56,46,.45)}
.w-k{margin:0 0 .5em!important;font:700 .74rem/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
.w-tile h3{font-size:clamp(1.25rem,1.9vw,1.65rem);line-height:1.15;margin-bottom:.4em}
.w-show{display:grid;grid-template-columns:.9fr 1fr;gap:clamp(14px,1.8vw,24px);padding:0}
.w-photo{overflow:hidden}
.w-photo img{width:100%;height:100%;object-fit:cover;object-position:60% 40%}
.w-show .w-body{padding:clamp(18px,2.2vw,28px) clamp(18px,2.2vw,28px) clamp(18px,2.2vw,28px) 0;align-self:center}
.w-q{margin:0 0 .9em!important;font:italic 500 clamp(1.15rem,1.6vw,1.4rem)/1.25 var(--serif)}
.w-themes{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.w-themes li{padding:.4em .8em;border-radius:99px;background:#E3F5EC;font:600 .8rem/1 var(--sans)}
.w-room{display:flex;flex-direction:column;background:#EFE9FD}
.w-room .w-tier:first-of-type{margin-top:auto}
.w-tier{padding:12px 14px;border-radius:16px;background:rgba(255,253,245,.85);margin-top:10px}
.w-tier b{display:block;font:700 1rem/1.2 var(--display)}
.w-tier span{font-size:.9rem;opacity:.8}
.w-tier-2{background:var(--night);color:#fff}
.w-tier-2 b{color:var(--butter)}
.w-prods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.w-prods figure{margin:0}
.w-prods img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px}
.w-prods figcaption{margin-top:6px;font-size:.78rem;line-height:1.3;opacity:.85}
.w-prods b{display:block;font:700 .85rem/1.2 var(--display);opacity:1}
.w-mantra{background:var(--night);color:#fff;display:flex;flex-direction:column}
.w-mantra .w-k{color:#FF9FB8}
.w-says{position:relative;flex:1;min-height:3.2em;margin:0!important;font:italic 500 clamp(1.9rem,3.4vw,3rem)/1.1 var(--serif);color:var(--butter)}
.w-says span{will-change:opacity,transform;position:absolute;inset:0;display:flex;align-items:center;opacity:0;animation:mantra 12s infinite}
.w-says span:nth-child(2){animation-delay:4s}.w-says span:nth-child(3){animation-delay:8s}
@keyframes mantra{0%{opacity:0;transform:translateY(8px)}6%,30%{opacity:1;transform:none}36%,100%{opacity:0;transform:translateY(-8px)}}
.w-note{margin:0!important;font-size:.9rem;opacity:.75}

/* The end's sky warms and its sun comes up as the page pulls in (JS sets --in, 0 to 1 as the page arrives),
   and the underline draws itself in the last stretch. Everything you read is already there, solid. */
.js-open .p-end .e-warm{opacity:var(--in,1)}
.js-open .p-end .e-sun{transform:translate(-50%,calc(100% - var(--in,1) * 34%))}
.p-end .e-u path{--t:clamp(0,(var(--in,1) - .7) / .28,1)}
.js-open .p-end .e-u path{stroke-dashoffset:calc(1 - var(--t));opacity:calc(var(--t) * 50)}

/* ---------- The ask ---------- */
.p-ask{background:linear-gradient(180deg,#FFF9CF,#FFEFB8)}
.p-ask h2{font-size:clamp(3rem,7.4vw,6.4rem);line-height:.95;margin-bottom:.3em}
.p-ask .a-intro{max-width:40em;font-size:clamp(1.25rem,2.1vw,1.6rem);line-height:1.4;margin-top:0}
.ask-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,24px);margin-top:clamp(22px,3.5vh,40px)}
.ask-grid > div{background:var(--card);border-radius:28px;padding:clamp(22px,2.8vw,34px);box-shadow:0 24px 50px -34px rgba(23,56,46,.45)}
.ask-n{display:block;font:italic 500 clamp(2.2rem,3.4vw,3rem)/1 var(--serif);color:var(--rose);margin-bottom:.25em}
.ask-grid h3{margin-bottom:.35em;font-size:clamp(1.5rem,2.3vw,2rem)}
/* Two lines each, so the three cards read as a set. */
.ask-grid p{margin:0!important;font-size:clamp(1.05rem,1.4vw,1.2rem);line-height:1.45;min-height:4.35em}
.ask-ip{margin-top:clamp(22px,3.5vh,40px)}
.ask-ip-h{margin:0 0 12px!important;font:700 .8rem/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.ask-ip ul{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.ask-ip li{padding:.5em 1em;border-radius:99px;background:var(--night);color:var(--butter);font:italic 500 clamp(.95rem,1.2vw,1.08rem)/1.1 var(--serif)}
.ask-ip li:nth-child(even){background:var(--rose);color:#fff}

/* ---------- The end: a page like the others. As it arrives, the sky warms, the sun comes up,
   her line comes into focus word by word, it gets underlined, and the buttons appear. Timed, not scrolled. ---------- */
.p-end{text-align:center;background:linear-gradient(180deg,#CDEFDC,#F4F3C2)}
.p-end > .wrap{position:relative;z-index:1}
.p-end h2{font-size:clamp(2.4rem,5.6vw,4.6rem)}
.e-warm{position:absolute;inset:0;background:linear-gradient(180deg,#EAE3FB 0%,#F6E3F4 45%,#FFDCE5 100%)}
.e-sun{position:absolute;left:50%;bottom:0;width:min(64vh,70vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(#FFE9A8 52%,#FFD15C 53% 70%,rgba(255,209,92,0) 71%);transform:translate(-50%,66%)}
.e-q{max-width:900px;margin:clamp(14px,3vh,34px) auto 0;font:italic 500 clamp(1.9rem,4.4vw,3.6rem)/1.12 var(--serif);letter-spacing:-.015em}
.e-l{display:block}
.e-q .w{display:inline-block}
.e-u{position:relative;display:inline-block;white-space:nowrap;color:var(--rose)}
.e-u svg{position:absolute;left:-2%;bottom:-.16em;width:104%;height:.3em;overflow:visible}
.e-u path{fill:none;stroke:var(--butter);stroke-width:7;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.e-act{margin-top:clamp(22px,4vh,40px)}
.end-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.a-btn-butter{background:var(--butter);color:var(--night)}
.p-end .a-btn-butter{background:var(--night);color:var(--butter)}

/* ---------- Entrances: from the left, the right, or a pop. Once each. ---------- */
.js-open :is(.rise,.from-left,.from-right,.pop){opacity:0;transition:opacity 650ms var(--ease) var(--d,0ms),transform 800ms var(--ease) var(--d,0ms)}
.js-open .rise{transform:translateY(24px)}
.js-open .from-left{transform:translateX(-48px)}
.js-open .from-right{transform:translateX(48px)}
.js-open .pop{transform:scale(.97)}
.js-open :is(.rise,.from-left,.from-right,.pop).in{opacity:1;transform:none}
/* The page fades up once, then lets go: a finished animation left in place keeps the whole page in one layer and makes scrolling stutter. */
.page-in{animation:lift 800ms var(--ease) 320ms backwards}
.resuming .page-in{animation-delay:0ms}

@keyframes rise{from{transform:translateY(60%)}}
@keyframes lift{from{opacity:0;transform:translateY(40px)}}
@keyframes gate-off{to{opacity:0;visibility:hidden}}

/* Without pinning (phones, short screens, reduced motion) each scene plays once as it arrives. */
.no-pin .scene{height:auto}
.no-pin .stage{position:relative;height:auto;min-height:0;transition:--p 1600ms var(--ease)}
.no-pin .s-quote .stage{padding:110px var(--gut)}

@media (max-width:860px){
  .a-head-guests,.talks,.ask-grid,.world,.w-show{grid-template-columns:1fr}
  .w-photo{aspect-ratio:16/9}
  .w-show .w-body{padding:0 20px 20px}
  .w-prods{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ticket{grid-template-columns:1fr;border-radius:24px}
  .ticket-stub{flex-direction:row;border-left:0;border-top:3px dashed var(--card);padding:18px}
  .ticket-stub b{writing-mode:horizontal-tb;rotate:none;font-size:1.15rem}
  .s-mirror .stage{grid-template-columns:1fr}
  .half{grid-template-rows:auto;padding:clamp(40px,6vw,90px) clamp(24px,5vw,80px)}
  .half .giant,.half p{grid-row:auto}
  .no-pin .m-star{position:relative;left:auto;top:auto;margin:-40px auto;z-index:1;opacity:var(--e);transform:none}
  .no-pin .s-mirror .stage{display:flex;flex-direction:column}
  .no-pin .m-cap{position:relative;bottom:auto;padding:60px var(--gut)}
}
@media (max-width:560px){
  .g-card h3,.g-role span{white-space:normal}
  .page{border-radius:30px 30px 0 0;margin-bottom:calc(var(--hold,0px) * .5)}
  .film-soon{font-size:.8rem}
  .end-btns .a-btn{width:100%}
  .a-top img{height:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js-open :is(.rise,.from-left,.from-right,.pop){opacity:1;transform:none}
  .w-says span:first-child{opacity:1}
  .page{transform:none!important;filter:none!important;margin-bottom:0}
  .stage{--p:1}
  .page{--in:1!important}
}
</style>
</head>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const gate = $('[data-gate]'), form = $('[data-gate-form]'), msg = $('[data-gate-msg]'), page = $('[data-page]'), content = $('[data-content]');
  const sealed = JSON.parse($('#sealed').textContent);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const KEY = 'abh-collaborator';
  const remember = { get() { try { return sessionStorage.getItem(KEY); } catch { return null; } }, set(v) { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch { /* this visit only */ } } };

  // The key comes from the email and the password together, so both are needed.
  const secret = (em, pw) => `${em.trim().toLowerCase()}\n${pw}`;
  async function unseal(pw) {
    if (!sealed.data) throw new Error('unsealed');
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(sealed.salt), iterations: sealed.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(sealed.iv) }, key, b64(sealed.data));
    return new TextDecoder().decode(plain);
  }

  const hills = '<div class="hills" aria-hidden="true"><svg viewBox="0 0 1600 150" preserveAspectRatio="xMidYMax slice"><path d="M0 92C260 40 520 60 800 88S1320 110 1600 66V150H0Z" fill="#BFE3C8"/><rect x="1367.75" y="59.4" width="4.5" height="30.6" fill="#5E7A6C"/><circle cx="1370" cy="45" r="22.5" fill="#BBB2E6"/><circle cx="1356.5" cy="57.6" r="13.5" fill="#BBB2E6"/><circle cx="1383.5" cy="57.6" r="13.5" fill="#BBB2E6"/><path d="M0 116C300 84 620 124 900 110S1360 92 1600 118V150H0Z" fill="#FFF6E6"/></svg></div>';

  // The film sits behind a frosted "Play me" cover. A video file (data-src) or an unlisted YouTube id (data-youtube) plays on click.
  // A video file fades out over its last second and hands straight back to the cover, ready to play again.
  function film(root) {
    const el = $('.film', root);
    if (!el) return;
    const yt = el.dataset.youtube, src = el.dataset.src, poster = el.dataset.poster;
    el.insertAdjacentHTML('beforeend', '<button class="film-play" type="button" aria-label="Play my film"><span class="film-word">Play me</span><i aria-hidden="true"></i></button>');
    const btn = $('.film-play', el);
    btn.addEventListener('click', () => {
      if (src) {
        const v = document.createElement('video');
        Object.assign(v, { controls: true, playsInline: true, poster, src });
        v.className = 'film-video';
        el.append(v);
        el.classList.add('is-playing');
        v.play().catch(() => {});
        // One email when she starts the film and one if she watches it to the end, once each per visit.
        if (!film.started) { film.started = true; notify('Emily pressed Play on your film'); }
        v.addEventListener('ended', () => { if (!film.finished) { film.finished = true; notify('Emily watched your film to the end'); } }, { once: true });
        // In the last second the film fades out while the cover fades in right behind it, so one blends into the other.
        const close = () => { v.classList.add('is-fading'); el.classList.remove('is-playing'); };
        v.addEventListener('timeupdate', () => { if (v.duration && v.duration - v.currentTime < 1.1) close(); });
        v.addEventListener('ended', () => { close(); setTimeout(() => v.remove(), 1100); }, { once: true });
      } else if (yt) el.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(yt)}?autoplay=1&rel=0&modestbranding=1" title="Abigail’s film" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
      else if (!$('.film-soon', el)) el.insertAdjacentHTML('beforeend', '<p class="film-soon">My film is on its way</p>');
    });
  }

  // Scroll choreography. Pages stick and get covered (--c); scenes pin and play against the scroll (--p).
  function motion() {
    const root = document.documentElement, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const pages = [...content.querySelectorAll('.page')], scenes = [...content.querySelectorAll('.scene')];
    const clamp = (v) => Math.min(1, Math.max(0, v));
    let pin = false, ticking = false;
    // Positions are measured once in layout(); each scroll frame then only reads scrollY and writes what changed.
    const tops = new Map(), heights = new Map(), last = new Map();
    const set = (el, prop, v) => { const k = el.dataset.k + prop; if (last.get(k) !== v) { last.set(k, v); el.style.setProperty(prop, v); } };
    const endPage = content.querySelector('.p-end');
    function frame() {
      ticking = false;
      const vh = innerHeight, y = scrollY;
      if (!reduce) pages.forEach((p) => {
        const n = p.nextElementSibling, c = n ? clamp(1 - (tops.get(n) - y) / vh) : 0;
        set(p, '--c', c.toFixed(3));
        const hide = c >= 1 ? 'hidden' : '';
        if (p.style.visibility !== hide) p.style.visibility = hide;
      });
      // The end's sky and sun follow how far that page has arrived: 0 as it enters, 1 once it has locked.
      if (endPage) set(endPage, '--in', reduce ? '1' : clamp(1 - (tops.get(endPage) - y) / vh).toFixed(3));
      if (pin) scenes.forEach((s) => set(s.firstElementChild, '--p', clamp((vh - (tops.get(s) - y)) / heights.get(s)).toFixed(4)));
    }
    function layout() {
      pin = !reduce && innerWidth >= 900 && innerHeight >= 560;
      root.classList.toggle('pin', pin);
      root.classList.toggle('no-pin', !pin);
      const head = document.querySelector('.a-top')?.offsetHeight || 0;
      root.style.setProperty('--head', `${head}px`);
      // Fit each page's content to the screen, so no page is taller than the window on any computer.
      pages.forEach((p) => {
        const w = p.firstElementChild;
        if (p.classList.contains('a-hero') || !w) return;
        w.style.zoom = '';
        if (!pin) return;
        const room = innerHeight - head - 40, h = w.offsetHeight;
        if (h > room) w.style.zoom = Math.max(0.55, room / h).toFixed(3);
      });
      pages.forEach((p) => {
        const top = Math.min(0, innerHeight - p.offsetHeight);
        p.style.top = `${top}px`;
        p.style.transformOrigin = `50% ${innerHeight / 2 - top}px`;
      });
      // Where each page and scene sits in the document when nothing is stuck: one pass, no reads while scrolling.
      let acc = content.getBoundingClientRect().top + scrollY;
      [...content.children].forEach((el, i) => {
        el.dataset.k = i;
        tops.set(el, acc); heights.set(el, el.offsetHeight);
        acc += el.offsetHeight + parseFloat(getComputedStyle(el).marginBottom || 0);
      });
      last.clear();
      if (!pin) scenes.forEach((s) => s.firstElementChild.style.setProperty('--p', reduce || s.dataset.seen ? 1 : 0));
      frame();
    }
    const seen = new IntersectionObserver((es) => es.forEach((e) => {
      if (!e.isIntersecting) return;
      e.target.dataset.seen = '1';
      if (!pin) e.target.firstElementChild.style.setProperty('--p', 1);
      seen.unobserve(e.target);
    }), { threshold: 0.2 });
    scenes.forEach((s) => seen.observe(s));
    addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }, { passive: true });
    addEventListener('resize', layout);
    new ResizeObserver(layout).observe(content);
    layout();
  }

  function open(html, instant) {
    content.innerHTML = html;
    $('.a-hero', content)?.insertAdjacentHTML('beforeend', hills);
    film(content);
    content.querySelectorAll('[data-words]').forEach((el) => {
      const text = el.textContent.trim(), words = text.split(/\s+/), esc = (w) => w.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      el.innerHTML = `<span class="sr">${esc(text)}</span>` + words.map((w, i) => {
        const a = (i / words.length) * 0.66;
        return `<span class="w" aria-hidden="true" style="--a:${a.toFixed(3)};--b:${(a + 0.16).toFixed(3)}">${esc(w)}</span>`;
      }).join(' ');
    });
    document.documentElement.classList.add('js-open');
    page.hidden = false;
    page.classList.add('page-in');
    page.addEventListener('animationend', () => page.classList.remove('page-in'), { once: true });
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -10% 0px' });
    content.querySelectorAll('.rise,.from-left,.from-right,.pop').forEach((el) => io.observe(el));
    motion();
    if (instant) gate.hidden = true;
    else { gate.classList.add('is-open'); setTimeout(() => { gate.hidden = true; }, 400); }
    scrollTo(0, 0);
  }

  // On a fresh sign-in, a note goes to the address kept inside the sealed page (via FormSubmit), so the owner knows it was opened.
  function notify(subject = 'Emily just opened her page') {
    const url = $('[data-notify]', content)?.dataset.notify;
    if (!url) return;
    const when = new Date().toLocaleString('en-GB', { timeZone: 'Europe/London', dateStyle: 'full', timeStyle: 'short' });
    const device = /iPhone|Android.*Mobile/.test(navigator.userAgent) ? 'Phone' : /iPad|Tablet/.test(navigator.userAgent) ? 'Tablet' : 'Computer';
    fetch(url, { method: 'POST', keepalive: true, referrerPolicy: 'origin', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ _subject: subject, _template: 'table', _captcha: 'false', When: `${when} (UK time)`, Device: `${device}, ${screen.width}×${screen.height}` }) }).catch(() => {});
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!form.em.value.trim() || !form.pw.value) { msg.textContent = 'Both your email and password, please.'; return; }
    const pw = secret(form.em.value, form.pw.value);
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Checking…'; msg.textContent = '';
    try { open(await unseal(pw)); remember.set(pw); notify(); }
    catch (err) { msg.textContent = err.message === 'unsealed' ? 'This page hasn’t been sealed yet.' : 'That email and password don’t match. Try again?'; form.pw.select(); }
    finally { btn.disabled = false; btn.textContent = 'Let me in'; }
  });

  $('[data-lock]').addEventListener('click', () => { remember.set(null); form.reset(); location.href = './'; });
  $('[data-show]').addEventListener('click', (e) => {
    const on = form.pw.type === 'password';
    form.pw.type = on ? 'text' : 'password';
    e.currentTarget.textContent = on ? 'Hide' : 'Show';
    e.currentTarget.setAttribute('aria-pressed', String(on));
    form.pw.focus();
  });

  const saved = remember.get();
  if (saved) unseal(saved).then((h) => open(h, true)).catch(() => { remember.set(null); document.documentElement.classList.remove('resuming'); });
})();
</script>
</body>
</html>

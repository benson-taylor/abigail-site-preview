<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A private look | A Brighter Humanity</title>
<meta name="description" content="A private page about Abigail Tracey and A Brighter Humanity.">
<meta name="theme-color" content="#CDEFDC">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<style>
/* A standalone page: it does not load site.js, so it never redirects into a modal.
   The content is sealed below and only opens with the password. See scripts/seal-agent.mjs. */
@font-face{font-family:"Bodoni Moda";src:url(assets/fonts/bodoni-moda-latin-wght-italic.woff2) format("woff2");font-weight:400 900;font-style:italic;font-display:swap}
@font-face{font-family:"Bodoni Moda";src:url(assets/fonts/bodoni-moda-latin-wght-normal.woff2) format("woff2");font-weight:400 900;font-style:normal;font-display:swap}
@font-face{font-family:"Alfa Slab One";src:url(assets/fonts/alfa-slab-one-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url(assets/fonts/bricolage-grotesque-latin-wght-normal.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"DM Sans";src:url(assets/fonts/dm-sans-latin-wght-normal.woff2) format("woff2");font-weight:100 1000;font-display:swap}
:root{
  --night:#17382E;--rose:#D81F5F;--butter:#FFD15C;--ivory:#FFF6E6;--card:#FFFDF5;
  --ease:cubic-bezier(0.23,1,0.32,1);
  --serif:"Bodoni Moda",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif;--display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
  --gut:clamp(16px,5vw,64px);
}
*{box-sizing:border-box}
html{overflow-x:clip;scroll-behavior:smooth}
body{margin:0;background:var(--ivory);color:var(--night);font:400 1.0625rem/1.6 var(--sans);overflow-x:clip}
img{display:block;max-width:100%;height:auto}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:1.02;margin:0;text-wrap:balance}
h1 em,h2 em{font:italic 500 1em/1 var(--serif);letter-spacing:-.01em;color:var(--rose)}
h2{font-size:clamp(2.2rem,5.6vw,4.4rem)}
h3{font-size:1.3rem;letter-spacing:-.015em}
p{margin:0 0 1em}
a{color:inherit}
:focus-visible{outline:3px solid var(--butter);outline-offset:3px;box-shadow:0 0 0 6px var(--night)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.pill{display:inline-block;background:var(--night);color:var(--ivory);font:700 .86rem/1 var(--sans);padding:.6em 1em;border-radius:99px;margin-bottom:1.1em}

/* ---------- The gate: morning sky, hills, the sun coming up ---------- */
.gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px 16px 150px;overflow:hidden;background:linear-gradient(180deg,#CDEFDC,#F4F3C2)}
.gate-sun{position:absolute;right:12%;bottom:120px;width:clamp(120px,18vw,210px);aspect-ratio:1;border-radius:50%;background:radial-gradient(#FFE9A8 52%,#FFD15C 53% 70%,rgba(255,209,92,0) 71%);animation:rise 10s var(--ease) both}
.gate-hills{position:absolute;inset:auto 0 0;height:clamp(110px,16vw,190px)}
.gate-hills svg{width:100%;height:100%}
.gate-card{position:relative;z-index:1;width:min(440px,100%);background:var(--card);border-radius:32px;padding:clamp(26px,5vw,40px);text-align:center;box-shadow:0 24px 50px -30px rgba(23,56,46,.5);animation:lift 900ms var(--ease) 200ms both}
.gate-card .logo{width:min(280px,80%);margin:0 auto 22px}
.gate-card h1{font-size:clamp(2rem,6vw,2.6rem);margin-bottom:.35em}
.gate-card p{margin:0 0 1.2em;font-size:1rem}
.gate-form{display:grid;gap:12px}
.gate-form input{width:100%;min-height:52px;border:0;border-radius:99px;padding:0 1.3em;font:500 1.05rem var(--sans);color:var(--night);background:#fff;box-shadow:inset 0 0 0 1.5px rgba(23,56,46,.18)}
.gate-form input:focus-visible{box-shadow:inset 0 0 0 2px var(--night);outline:none}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:5.2em}
.gate-form .pw-show{position:absolute;right:7px;top:50%;translate:0 -50%;min-height:38px;padding:0 14px;border:0;border-radius:99px;background:rgba(23,56,46,.08);color:var(--night);font:700 .85rem var(--sans);cursor:pointer}
.gate-form .pw-show:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.gate-form .pw-show:hover{transform:none;background:rgba(23,56,46,.14)}}
.gate-back{display:inline-block;margin-top:6px;font-size:.92rem;font-weight:600;text-underline-offset:3px}
.gate-msg{min-height:1.5em;margin:12px 0 0!important;font-size:.95rem!important;color:var(--rose);font-weight:600}
.gate.is-open{animation:gate-off 700ms var(--ease) forwards}
.gate[hidden]{display:none}

.a-btn,.gate-form button[type=submit]{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:.85em 1.6em;border:0;border-radius:99px;background:var(--rose);color:#fff;font:700 1.02rem/1.1 var(--sans);text-decoration:none;cursor:pointer;transition:transform 180ms var(--ease)}
.a-btn:active,.gate-form button[type=submit]:active{transform:scale(.97)}
.gate-form button[type=submit][disabled]{opacity:.7;cursor:progress}
@media (hover:hover) and (pointer:fine){.a-btn:hover,.gate-form button[type=submit]:hover{transform:translateY(-2px)}}

/* ---------- The page, once open ---------- */
.sealed-page[hidden]{display:none}
.a-top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px var(--gut);background:rgba(244,251,236,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.a-top img{height:22px;width:auto;max-width:62vw;object-fit:contain}
.a-top button{border:0;background:none;color:var(--night);font:600 .9rem var(--sans);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 2px;white-space:nowrap;flex:none}
@property --p{syntax:"<number>";inherits:true;initial-value:0}

/* Pages stack. Each one sticks when its bottom reaches the screen (top is set in JS),
   and the next pulls up over it. --c is how far it has been covered, 0 to 1. */
[data-content]{position:relative;z-index:1}
.page{position:sticky;top:0;min-height:100vh;min-height:100svh;padding:clamp(80px,11vw,140px) 0;border-radius:44px 44px 0 0;overflow:clip;box-shadow:0 -24px 50px -30px rgba(23,56,46,.35);transform:scale(calc(1 - var(--c,0) * .07));will-change:transform}
.page::after{content:"";position:absolute;inset:0;background:var(--night);opacity:calc(var(--c,0) * .22);pointer-events:none}
.page:first-child{border-radius:0;box-shadow:none}
.scene{position:relative;height:var(--len);background:var(--ivory)}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:clip}
.wrap{max-width:1180px;margin:auto;padding:0 var(--gut)}
.wrap-narrow{max-width:820px}
.wrap > h2{margin-bottom:.6em}
.a-intro{max-width:40em;font-size:clamp(1.15rem,1.8vw,1.35rem);margin-top:-.6em}

/* Every timed piece: --t runs 0 to 1 across its window [--a, --b] of the scene's --p, eased out. */
.wq .w,.wq footer,.h-you,.h-abi,.half p,.m-star,.m-cap,.ag-warm,.ag-sun,.ag-h,.ag-quotes,.ag-l,.ag-r,.ag-line{--t:clamp(0,(var(--p) - var(--a,0)) / (var(--b,1) - var(--a,0)),1);--e:calc(1 - (1 - var(--t)) * (1 - var(--t)))}

/* ---------- Hero ---------- */
.a-hero{text-align:center;padding:clamp(28px,5vw,60px) var(--gut) clamp(150px,17vw,210px);background:linear-gradient(180deg,#CDEFDC,#F4F3C2)}
.a-sub{max-width:34em;margin:.8em auto 1.8em;font-size:clamp(1.15rem,2vw,1.35rem)}
.a-scroll{position:relative;z-index:1;display:inline-flex;flex-direction:column;align-items:center;gap:6px;margin-top:clamp(34px,5vw,56px);text-decoration:none}
.a-scroll-big{font:italic 600 clamp(2.2rem,6vw,4.4rem)/1 var(--serif);color:var(--rose);letter-spacing:-.01em}
.a-scroll-small{font:800 clamp(1.15rem,2.4vw,1.7rem)/1.1 var(--display);letter-spacing:-.02em}
.a-scroll i{width:54px;height:54px;margin-top:14px;border-radius:50%;background:var(--night);position:relative;animation:nudge 1.6s var(--ease) infinite}
.a-scroll i::before{content:"";position:absolute;left:50%;top:44%;width:14px;height:14px;border:solid var(--butter);border-width:0 3px 3px 0;transform:translate(-50%,-50%) rotate(45deg)}
.a-hero .hills{position:absolute;inset:auto 0 0;height:clamp(90px,13vw,150px);pointer-events:none}
.a-hero .hills svg{width:100%;height:100%}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}

/* The film sits in an arched window, painted like the site's frames: warm wood, a maroon inner line, ivory beads, and a sill. */
.window{position:relative;z-index:1;max-width:1000px;margin:0 auto 30px;padding:clamp(10px,1.7vw,20px);background:#D79A62;border-radius:50% 50% 24px 24px/38% 38% 24px 24px;box-shadow:0 30px 60px -34px rgba(23,56,46,.6)}
.window::before{content:"";position:absolute;inset:clamp(4px,.7vw,8px);border:2.5px dotted #FFF6E6;border-radius:inherit;pointer-events:none}
.window::after{content:"";position:absolute;left:-4%;right:-4%;bottom:clamp(-28px,-2.4vw,-14px);height:clamp(14px,2.4vw,28px);border-radius:8px;background:#C4844F;box-shadow:inset 0 3px 0 rgba(255,246,230,.35),0 16px 26px -14px rgba(23,56,46,.55)}
.film{position:relative;aspect-ratio:16/9;border-radius:50% 50% 14px 14px/38% 38% 14px 14px;overflow:hidden;background:var(--card);box-shadow:0 0 0 2px #7C1D3B}
.film img,.film video,.film iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.film img{filter:brightness(1.06) saturate(.94) contrast(.96)}
.film-play{position:absolute;inset:0;display:grid;place-items:center;border:0;background:none;cursor:pointer}
.film-play span{display:inline-flex;align-items:center;gap:10px;padding:.8em 1.4em;border-radius:99px;background:rgba(255,253,245,.94);font:700 1rem var(--sans);color:var(--night);transition:transform 180ms var(--ease)}
.film-play i{width:0;height:0;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent var(--rose)}
@media (hover:hover) and (pointer:fine){.film-play:hover span{transform:translateY(-2px)}}
.film-soon{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);white-space:nowrap;background:rgba(255,253,245,.94);color:var(--night);font:700 .9rem var(--sans);padding:.6em 1.1em;border-radius:99px}

/* The name sign. The bulbs chase and the name flashes. */
.sign-wrap{position:relative;z-index:1;max-width:900px;margin:0 auto -10px}
.marquee{width:100%;height:auto;overflow:visible}
.marquee .bulbs-a{animation:bulb .5s steps(1) infinite}
.marquee .bulbs-b{animation:bulb .5s steps(1) infinite -.25s}
.marquee .loud-name{animation:loud 1s steps(1) infinite}
.marquee .twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite alternate}
.marquee .t2{animation-delay:-.5s}.marquee .t3{animation-delay:-1s}
@keyframes bulb{0%{opacity:1}50%{opacity:.12}}
@keyframes loud{0%{fill:#FFD15C}50%{fill:#FF9FB8}}
@keyframes twinkle{from{transform:scale(.7);opacity:.6}to{transform:scale(1.1);opacity:1}}

/* ---------- Letter ---------- */
.p-letter{background:var(--ivory);display:grid;align-items:center}
.letter{position:relative;background:var(--card);border-radius:28px;padding:clamp(28px,5vw,60px);box-shadow:0 30px 60px -34px rgba(23,56,46,.55);font:400 clamp(1.15rem,2vw,1.35rem)/1.6 var(--sans);rotate:-1.2deg}
.letter::before{content:"✦";position:absolute;top:-18px;left:50%;translate:-50% 0;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--butter);font-size:1.05rem}
.letter-hi,.letter-sign{font:italic 500 clamp(1.7rem,3.2vw,2.3rem)/1.2 var(--serif);color:var(--rose)}
.letter-sign{margin:1.2em 0 0!important}

/* ---------- Scene: the quote, word by word ---------- */
.s-quote .stage{display:grid;place-content:center;justify-items:center;text-align:center;padding:0 var(--gut);background:linear-gradient(180deg,#FFF6E6,#FFE3EA)}
.wq{margin:0;max-width:1100px}
.wq p{font:italic 500 clamp(2.6rem,7.4vw,6.6rem)/1.02 var(--serif);color:var(--rose);margin:0 0 .5em;letter-spacing:-.015em}
.wq .w{display:inline-block;opacity:calc(.12 + .88 * var(--e));transform:translateY(calc((1 - var(--e)) * .25em))}
.wq footer{--a:.82;--b:.97;font-weight:600;font-size:1.05rem;opacity:var(--e)}

/* ---------- Scene: you and Abigail, side by side ---------- */
.s-mirror .stage{display:grid;grid-template-columns:1fr 1fr;background:var(--ivory)}
.half{display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,2vw,26px);padding:clamp(40px,6vw,90px) clamp(24px,5vw,80px)}
.h-you{--a:0;--b:.42;background:linear-gradient(160deg,#FFF9CF,#FFE7A6);transform:translateX(calc((1 - var(--e)) * -70%));text-align:right;align-items:flex-end}
.h-abi{--a:.1;--b:.52;background:linear-gradient(200deg,#FFE3EA,#FFC7D4);transform:translateX(calc((1 - var(--e)) * 70%))}
.giant{font:400 clamp(3rem,7.4vw,8.4rem)/.9 "Alfa Slab One",serif;text-transform:uppercase;color:var(--night);letter-spacing:.01em}
.h-abi .giant{color:var(--rose)}
.half p{--a:.5;--b:.72;max-width:17em;margin:0;font:700 clamp(1.25rem,2.2vw,1.85rem)/1.3 var(--display);letter-spacing:-.02em;opacity:var(--e)}
.h-abi p{--a:.58;--b:.8}
.m-star{--a:.4;--b:.6;position:absolute;left:50%;top:50%;width:clamp(70px,9vw,120px);aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:var(--night);color:var(--butter);font-size:clamp(2rem,4vw,3.2rem);box-shadow:0 0 0 10px var(--ivory);transform:translate(-50%,-50%) scale(var(--e)) rotate(calc(var(--p) * 360deg))}
.m-cap{--a:.82;--b:.98;position:absolute;left:0;right:0;bottom:clamp(24px,6vh,60px);margin:0;text-align:center;font:italic 500 clamp(1.4rem,2.6vw,2.2rem)/1.2 var(--serif);opacity:var(--e)}

/* ---------- The ticket ---------- */
.p-ticket{background:linear-gradient(180deg,#E7F4EE,#FFF9CF);display:grid;align-items:center}
.ticket{position:relative;display:grid;grid-template-columns:1fr 250px;max-width:1080px;margin:auto;border-radius:34px;background:var(--card);box-shadow:0 40px 80px -40px rgba(23,56,46,.6)}
.ticket-main{position:relative;padding:clamp(28px,5vw,56px)}
.t-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
.t-ox{width:clamp(150px,20vw,210px);height:auto}
.t-rec{display:inline-flex;align-items:center;gap:10px;padding:.55em 1em;border-radius:99px;background:var(--night);color:#fff;font:700 .8rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.t-rec i{width:10px;height:10px;border-radius:50%;background:#FF4D6D;box-shadow:0 0 0 0 rgba(255,77,109,.6);animation:rec 1.2s steps(1) infinite}
@keyframes rec{50%{opacity:.15}}
.ticket-kicker{display:inline-block;background:var(--butter);font:700 .86rem/1 var(--sans);padding:.6em 1em;border-radius:99px;margin-bottom:1em}
.t-head{font:400 clamp(1.7rem,3.8vw,3rem)/1 "Alfa Slab One",serif;letter-spacing:.01em;text-transform:uppercase;margin-bottom:.7em;color:var(--night)}
.t-head span{color:#002147}
.t-admit{margin:0 0 .1em!important;font:700 .82rem/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
.t-name{margin:0 0 .5em!important;font:400 clamp(2.6rem,7vw,5.6rem)/.95 "Alfa Slab One",serif;color:var(--rose);letter-spacing:-.01em;text-shadow:3px 3px 0 var(--butter)}
.t-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 26px;margin:0 0 28px;padding:20px 0 0;border-top:2px dashed rgba(23,56,46,.2)}
.t-fields div:first-child{grid-column:1/-1}
.t-fields dt{font:700 .75rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;opacity:.6;margin-bottom:6px}
.t-fields dd{margin:0;font:600 1.08rem/1.35 var(--sans)}
.t-stamp{position:absolute;bottom:clamp(24px,4vw,48px);right:clamp(20px,4vw,48px);display:grid;place-items:center;width:clamp(96px,11vw,128px);aspect-ratio:1;border-radius:50%;border:4px double var(--rose);color:var(--rose);font:400 clamp(1.5rem,2.6vw,2rem)/.9 "Alfa Slab One",serif;text-align:center;text-transform:uppercase;rotate:-14deg;opacity:0;scale:2.2}
.t-stamp small{font:700 .7rem/1 var(--sans);letter-spacing:.2em}
.ticket.in .t-stamp{animation:stamp 500ms var(--ease) 900ms forwards}
@keyframes stamp{to{opacity:.9;scale:1}}
.ticket-stub{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:30px 18px;background:#002147;color:#fff;text-align:center;border-radius:0 34px 34px 0;border-left:4px dashed var(--card)}
.ticket-stub::before,.ticket-stub::after{content:"";position:absolute;left:-18px;width:32px;height:32px;border-radius:50%;background:#F4F6DE}
.ticket-stub::before{top:-16px}.ticket-stub::after{bottom:-16px}
.ticket-stub span{font:700 .8rem/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--butter)}
.ticket-stub b{font:400 clamp(2.4rem,4vw,3.2rem)/1 "Alfa Slab One",serif;color:var(--butter);text-transform:uppercase}
.ticket-stub .t-sur{font-size:1.25rem;color:#fff;letter-spacing:.08em}
.t-code{width:150px;height:46px;margin-top:14px;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 5px,#fff 5px 9px,transparent 9px 11px,#fff 11px 12px,transparent 12px 16px)}
.ticket-stub small{font:600 .72rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:.75}

/* ---------- Scene: two rooms, one belief ---------- */
.s-agree .stage{display:grid;grid-template-rows:auto 1fr;align-items:center;padding:clamp(70px,10vh,110px) var(--gut) 40px;background:linear-gradient(180deg,#CDEFDC,#F4F3C2);text-align:center}
.ag-warm{--a:.5;--b:.9;position:absolute;inset:0;background:linear-gradient(180deg,#FFF9CF,#FFD9C2);opacity:var(--e)}
.ag-sun{--a:.5;--b:.95;position:absolute;left:50%;bottom:0;width:min(70vh,80vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(#FFE9A8 50%,#FFD15C 51% 68%,rgba(255,209,92,0) 69%);transform:translate(-50%,calc(100% - var(--e) * 55%))}
.ag-h{--a:.5;--b:.6;position:relative;font-size:clamp(2.2rem,5.6vw,4.6rem);opacity:calc(1 - var(--e))}
.ag-quotes{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1100px;width:100%;margin:auto;text-align:left}
.ag-q{margin:0;padding:clamp(26px,3.5vw,42px);border-radius:30px;background:var(--card);box-shadow:0 30px 60px -36px rgba(23,56,46,.5)}
.ag-q p{font:italic 500 clamp(1.6rem,3vw,2.5rem)/1.15 var(--serif);margin:0 0 .7em}
.ag-q footer{font-weight:600}
.ag-l{--a:0;--b:.34;transform:translateX(calc((1 - var(--e)) * -75vw)) rotate(calc((1 - var(--e)) * -8deg))}
.ag-r{--a:.08;--b:.42;transform:translateX(calc((1 - var(--e)) * 75vw)) rotate(calc((1 - var(--e)) * 8deg))}
.ag-line{--a:.62;--b:.84;position:absolute;inset:0;display:grid;place-content:center;margin:0;padding:0 var(--gut);font:800 clamp(2.6rem,7.4vw,6.4rem)/1 var(--display);letter-spacing:-.035em;text-wrap:balance;opacity:var(--e);transform:scale(calc(.8 + var(--e) * .2))}
.ag-line em{display:block;font:italic 500 1.05em/1.05 var(--serif);color:var(--rose)}
.pin .ag-quotes{--a:.55;--b:.66;opacity:calc(1 - var(--e));scale:calc(1 - var(--e) * .1)}

/* ---------- Guests ---------- */
.p-guests{background:linear-gradient(180deg,#E3F5EC,#CDEFDC)}
.a-head-guests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,3vw,30px);margin-top:44px}
.g-card{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:34px;padding:clamp(24px,3.5vw,40px);box-shadow:0 30px 60px -36px rgba(23,56,46,.5)}
.g-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.g-logo{display:grid;place-items:center;height:64px;width:min(210px,62%);padding:8px 14px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.5px rgba(23,56,46,.1)}
.g-logo img{max-height:48px;width:auto;max-width:100%}
.g-tag{margin:0!important;background:var(--butter);font:700 .82rem/1 var(--sans);padding:.6em 1em;border-radius:99px}
.g-pic{width:clamp(150px,18vw,200px);aspect-ratio:1;border-radius:999px 999px 28px 28px;overflow:hidden;margin-bottom:22px}
.g-pic img{width:100%;height:100%;object-fit:cover;filter:brightness(1.05) saturate(.95)}
.g-card h3{font-size:clamp(1.6rem,2.8vw,2.2rem);margin-bottom:.3em}
.g-role{font-weight:700;color:var(--rose);line-height:1.4;min-height:2.8em}
.g-ep{font:italic 500 clamp(1.3rem,2vw,1.6rem)/1.25 var(--serif)}
.g-blurb{flex:1}
.g-credit{font-size:.75rem;opacity:.6;margin:0!important}

/* ---------- In talks ---------- */
.p-talks{background:linear-gradient(180deg,#FFF0F3,#FFE3EA)}
.talks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2.4vw,26px);margin-top:40px}
.talk{display:flex;flex-direction:column;background:var(--card);border-radius:30px;padding:clamp(20px,2.6vw,30px);box-shadow:0 24px 50px -34px rgba(23,56,46,.45)}
.talk-pic{aspect-ratio:1;border-radius:999px 999px 24px 24px;overflow:hidden;margin-bottom:20px}
.talk-pic img{width:100%;height:100%;object-fit:cover;filter:brightness(1.05) saturate(.95)}
.talk-ep{flex:1;font:italic 500 clamp(1.3rem,2vw,1.6rem)/1.2 var(--serif);color:var(--rose)}
.talk h3{font-size:1.2rem;margin-bottom:.25em}
.talk-role{font-size:.95rem;opacity:.8;margin-bottom:.8em}

/* ---------- Why, built ---------- */
.p-why{background:linear-gradient(180deg,#FFF9CF,#FFEFB8)}
.a-why-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2.4vw,26px);margin-top:44px}
.a-why-grid > div{background:rgba(255,253,245,.75);border-radius:28px;padding:clamp(22px,3vw,34px)}
.a-why-grid h3{margin-bottom:.5em;font-size:1.45rem}
.p-built{background:var(--ivory)}
.a-built-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:44px}
.a-built-grid article{background:var(--card);border-radius:28px;padding:clamp(22px,3vw,34px);box-shadow:0 20px 44px -34px rgba(23,56,46,.45)}
.a-built-grid h3{margin:14px 0 .45em;font-size:1.45rem}
.dot{display:block;width:22px;height:22px;border-radius:50%;background:var(--c)}

/* ---------- The end, and the sign that won't stop flashing ---------- */
.p-end{background:linear-gradient(180deg,#CDEFDC,#F4F3C2);text-align:center;padding-bottom:60px}
.p-end h2{font-size:clamp(2.6rem,6.4vw,5rem)}
.lightbox{position:relative;max-width:1000px;margin:clamp(30px,5vw,50px) auto;padding:clamp(40px,6vw,70px) clamp(26px,5vw,70px);border-radius:30px;background:var(--night);box-shadow:0 0 0 8px var(--butter),0 40px 80px -40px rgba(23,56,46,.7)}
.lightbox::before,.lightbox::after{content:"";position:absolute;inset:8px;padding:12px;border-radius:24px;background:radial-gradient(circle,#FFF1BE 0 5px,transparent 6px) 0 0/30px 30px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:bulb .5s steps(1) infinite}
.lightbox::after{background-position:15px 15px;animation-delay:-.25s}
.flash{position:relative;margin:0;font:400 clamp(2rem,5.8vw,4.8rem)/1.06 "Alfa Slab One",serif;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;animation:all-flash 4s steps(1) infinite}
.flash span{display:inline-block;color:var(--butter);opacity:.16;animation:word-on 4s steps(1) infinite;animation-delay:calc(var(--i) * 120ms)}
.flash span:nth-child(even){color:#FF9FB8}
@keyframes word-on{0%{opacity:.16;text-shadow:none}3%,94%{opacity:1;text-shadow:0 0 22px currentColor}}
@keyframes all-flash{0%,72%{opacity:1}76%{opacity:.2}80%{opacity:1}84%{opacity:.2}88%,100%{opacity:1}}
.end-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.a-btn-butter{background:var(--butter);color:var(--night)}
.a-mail{margin-top:14px;font-weight:600}
.a-small{margin-top:60px!important;font-size:.85rem;opacity:.6}

/* ---------- Entrances: from the left, the right, or a pop. Once each. ---------- */
.js-open :is(.rise,.from-left,.from-right,.pop){opacity:0;transition:opacity 800ms var(--ease) var(--d,0ms),transform 1000ms var(--ease) var(--d,0ms)}
.js-open .rise{transform:translateY(30px)}
.js-open .from-left{transform:translateX(-18vw) rotate(-4deg)}
.js-open .from-right{transform:translateX(18vw) rotate(4deg)}
.js-open .pop{transform:scale(.82)}
.js-open .letter.from-left{transform:translateX(-30vw) rotate(-9deg)}
.js-open :is(.rise,.from-left,.from-right,.pop).in{opacity:1;transform:none}
.page-in{animation:lift 900ms var(--ease) both}

@keyframes rise{from{transform:translateY(60%)}}
@keyframes lift{from{opacity:0;transform:translateY(40px)}}
@keyframes gate-off{to{opacity:0;visibility:hidden}}

/* Without pinning (phones, short screens, reduced motion) each scene plays once as it arrives. */
.no-pin .scene{height:auto}
.no-pin .stage{position:relative;height:auto;min-height:0;transition:--p 1600ms var(--ease)}
.no-pin .s-quote .stage{padding:110px var(--gut)}
.no-pin .s-agree .stage{grid-template-rows:auto;gap:30px;padding:90px var(--gut) clamp(200px,40vw,300px)}
.no-pin .ag-line{position:relative;inset:auto;padding:0}
.no-pin .ag-sun{width:min(90vw,520px)}

@media (max-width:860px){
  .a-head-guests,.a-built-grid,.ag-quotes{grid-template-columns:1fr}
  .talks,.a-why-grid{grid-template-columns:1fr 1fr}
  .ticket{grid-template-columns:1fr}
  .ticket-stub{flex-direction:row;flex-wrap:wrap;gap:10px 16px;border-left:0;border-top:4px dashed var(--card);border-radius:0 0 34px 34px;padding:24px}
  .ticket-stub::before,.ticket-stub::after{left:auto;top:-18px;bottom:auto}
  .ticket-stub::before{left:-16px}.ticket-stub::after{right:-16px}
  .ticket-stub b{font-size:2rem}
  .t-code{width:120px;height:34px;margin-top:0}
  .s-mirror .stage{grid-template-columns:1fr}
  .h-you{text-align:left;align-items:flex-start}
  .no-pin .m-star{position:relative;left:auto;top:auto;margin:-40px auto;z-index:1;transform:scale(var(--e)) rotate(calc(var(--p) * 360deg))}
  .no-pin .s-mirror .stage{display:flex;flex-direction:column}
  .no-pin .m-cap{position:relative;bottom:auto;padding:60px var(--gut)}
}
@media (max-width:560px){
  .talks,.a-why-grid{grid-template-columns:1fr}
  .page{border-radius:30px 30px 0 0}
  .film-soon{font-size:.8rem}
  .t-fields{grid-template-columns:1fr}
  .t-stamp{bottom:22px;right:18px;width:84px;font-size:1.2rem}
  .talk-pic{width:min(100%,240px)}
  .end-btns .a-btn{width:100%}
  .a-top img{height:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js-open :is(.rise,.from-left,.from-right,.pop){opacity:1;transform:none}
  .page{transform:none}.page::after{display:none}
  .stage{--p:1}
  .flash span{opacity:1}
  .t-stamp{opacity:.9;scale:1}
}
</style>
</head>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const gate = $('[data-gate]'), form = $('[data-gate-form]'), msg = $('[data-gate-msg]'), page = $('[data-page]'), content = $('[data-content]');
  const sealed = JSON.parse($('#sealed').textContent);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const KEY = 'abh-agent';
  const remember = { get() { try { return sessionStorage.getItem(KEY); } catch { return null; } }, set(v) { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch { /* this visit only */ } } };

  // The key comes from the email and the password together, so both are needed.
  const secret = (em, pw) => `${em.trim().toLowerCase()}\n${pw}`;
  async function unseal(pw) {
    if (!sealed.data) throw new Error('unsealed');
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(sealed.salt), iterations: sealed.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(sealed.iv) }, key, b64(sealed.data));
    return new TextDecoder().decode(plain);
  }

  const hills = '<div class="hills" aria-hidden="true"><svg viewBox="0 0 1600 150" preserveAspectRatio="xMidYMax slice"><path d="M0 92C260 40 520 60 800 88S1320 110 1600 66V150H0Z" fill="#BFE3C8"/><rect x="1367.75" y="59.4" width="4.5" height="30.6" fill="#5E7A6C"/><circle cx="1370" cy="45" r="22.5" fill="#BBB2E6"/><circle cx="1356.5" cy="57.6" r="13.5" fill="#BBB2E6"/><circle cx="1383.5" cy="57.6" r="13.5" fill="#BBB2E6"/><path d="M0 116C300 84 620 124 900 110S1360 92 1600 118V150H0Z" fill="#FFF6E6"/></svg></div>';

  function film(root) {
    const el = $('.film', root);
    if (!el) return;
    const yt = el.dataset.youtube, src = el.dataset.src, poster = el.dataset.poster;
    if (src) { el.innerHTML = `<video controls playsinline preload="metadata" poster="${poster}" src="${src}"></video>`; return; }
    if (yt) {
      el.insertAdjacentHTML('beforeend', '<button class="film-play" type="button" aria-label="Play Abigail’s film"><span><i></i>Play her film</span></button>');
      $('.film-play', el).addEventListener('click', () => {
        el.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(yt)}?autoplay=1&rel=0&modestbranding=1" title="Abigail’s film" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
      }, { once: true });
      return;
    }
    el.insertAdjacentHTML('beforeend', '<p class="film-soon">Her film is on its way</p>');
  }

  // Scroll choreography. Pages stick and get covered (--c); scenes pin and play against the scroll (--p).
  function motion() {
    const root = document.documentElement, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const pages = [...content.querySelectorAll('.page')], scenes = [...content.querySelectorAll('.scene')];
    const clamp = (v) => Math.min(1, Math.max(0, v));
    let pin = false, ticking = false;
    function frame() {
      ticking = false;
      const vh = innerHeight;
      if (!reduce) pages.forEach((p) => {
        const n = p.nextElementSibling, c = n ? clamp(1 - n.getBoundingClientRect().top / vh) : 0;
        p.style.setProperty('--c', c.toFixed(3));
        p.style.visibility = c >= 1 ? 'hidden' : '';
      });
      if (pin) scenes.forEach((s) => {
        const r = s.getBoundingClientRect();
        s.firstElementChild.style.setProperty('--p', clamp(-r.top / (r.height - vh)).toFixed(4));
      });
    }
    function layout() {
      pin = !reduce && innerWidth >= 700 && innerHeight >= 560;
      root.classList.toggle('pin', pin);
      root.classList.toggle('no-pin', !pin);
      pages.forEach((p) => {
        const top = Math.min(0, innerHeight - p.offsetHeight);
        p.style.top = `${top}px`;
        p.style.transformOrigin = `50% ${innerHeight / 2 - top}px`;
      });
      if (!pin) scenes.forEach((s) => s.firstElementChild.style.setProperty('--p', reduce || s.dataset.seen ? 1 : 0));
      frame();
    }
    const seen = new IntersectionObserver((es) => es.forEach((e) => {
      if (!e.isIntersecting) return;
      e.target.dataset.seen = '1';
      if (!pin) e.target.firstElementChild.style.setProperty('--p', 1);
      seen.unobserve(e.target);
    }), { threshold: 0.2 });
    scenes.forEach((s) => seen.observe(s));
    addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }, { passive: true });
    addEventListener('resize', layout);
    new ResizeObserver(layout).observe(content);
    layout();
  }

  function open(html, instant) {
    content.innerHTML = html;
    $('.a-hero', content)?.insertAdjacentHTML('beforeend', hills);
    film(content);
    content.querySelectorAll('[data-words]').forEach((el) => {
      const text = el.textContent.trim(), words = text.split(/\s+/), esc = (w) => w.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      el.innerHTML = `<span class="sr">${esc(text)}</span>` + words.map((w, i) => {
        const a = (i / words.length) * 0.66;
        return `<span class="w" aria-hidden="true" style="--a:${a.toFixed(3)};--b:${(a + 0.16).toFixed(3)}">${esc(w)}</span>`;
      }).join(' ');
    });
    content.querySelectorAll('.flash span').forEach((s, i) => s.style.setProperty('--i', i));
    document.documentElement.classList.add('js-open');
    page.hidden = false;
    page.classList.add('page-in');
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -10% 0px' });
    content.querySelectorAll('.rise,.from-left,.from-right,.pop').forEach((el) => io.observe(el));
    motion();
    if (instant) gate.hidden = true;
    else { gate.classList.add('is-open'); setTimeout(() => { gate.hidden = true; }, 700); }
    scrollTo(0, 0);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!form.em.value.trim() || !form.pw.value) { msg.textContent = 'Both your email and password, please.'; return; }
    const pw = secret(form.em.value, form.pw.value);
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Checking…'; msg.textContent = '';
    try { open(await unseal(pw)); remember.set(pw); }
    catch (err) { msg.textContent = err.message === 'unsealed' ? 'This page hasn’t been sealed yet.' : 'That email and password don’t match. Try again?'; form.pw.select(); }
    finally { btn.disabled = false; btn.textContent = 'Let me in'; }
  });

  $('[data-lock]').addEventListener('click', () => { remember.set(null); form.reset(); location.reload(); });
  $('[data-show]').addEventListener('click', (e) => {
    const on = form.pw.type === 'password';
    form.pw.type = on ? 'text' : 'password';
    e.currentTarget.textContent = on ? 'Hide' : 'Show';
    e.currentTarget.setAttribute('aria-pressed', String(on));
    form.pw.focus();
  });

  const saved = remember.get();
  if (saved) unseal(saved).then((h) => open(h, true)).catch(() => remember.set(null));
})();
</script>
</body>

<style>
/* A standalone page: it does not load site.js, so it never redirects into a modal.
   The content is sealed below and only opens with the password. See scripts/seal-agent.mjs. */
@font-face{font-family:"Bodoni Moda";src:url(assets/fonts/bodoni-moda-latin-wght-italic.woff2) format("woff2");font-weight:400 900;font-style:italic;font-display:swap}
@font-face{font-family:"Bodoni Moda";src:url(assets/fonts/bodoni-moda-latin-wght-normal.woff2) format("woff2");font-weight:400 900;font-style:normal;font-display:swap}
@font-face{font-family:"Alfa Slab One";src:url(assets/fonts/alfa-slab-one-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url(assets/fonts/bricolage-grotesque-latin-wght-normal.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"DM Sans";src:url(assets/fonts/dm-sans-latin-wght-normal.woff2) format("woff2");font-weight:100 1000;font-display:swap}
:root{
  --night:#17382E;--rose:#D81F5F;--butter:#FFD15C;--ivory:#FFF6E6;--card:#FFFDF5;
  --ease:cubic-bezier(0.23,1,0.32,1);
  --serif:"Bodoni Moda",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif;--display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
  --gut:clamp(16px,5vw,64px);
}
*{box-sizing:border-box}
html{overflow-x:clip;scroll-behavior:smooth}
body{margin:0;background:var(--ivory);color:var(--night);font:400 1.0625rem/1.6 var(--sans);overflow-x:clip}
img{display:block;max-width:100%;height:auto}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:1.02;margin:0;text-wrap:balance}
h1 em,h2 em{font:italic 500 1em/1 var(--serif);letter-spacing:-.01em;color:var(--rose)}
h2{font-size:clamp(2.2rem,5.6vw,4.4rem)}
h3{font-size:1.3rem;letter-spacing:-.015em}
p{margin:0 0 1em}
a{color:inherit}
:focus-visible{outline:3px solid var(--butter);outline-offset:3px;box-shadow:0 0 0 6px var(--night)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.pill{display:inline-block;background:var(--night);color:var(--ivory);font:700 .86rem/1 var(--sans);padding:.6em 1em;border-radius:99px;margin-bottom:1.1em}

/* ---------- The gate: morning sky, hills, the sun coming up ---------- */
.gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px 16px 150px;overflow:hidden;background:linear-gradient(180deg,#CDEFDC,#F4F3C2)}
.gate-sun{position:absolute;right:12%;bottom:120px;width:clamp(120px,18vw,210px);aspect-ratio:1;border-radius:50%;background:radial-gradient(#FFE9A8 52%,#FFD15C 53% 70%,rgba(255,209,92,0) 71%);animation:rise 10s var(--ease) both}
.gate-hills{position:absolute;inset:auto 0 0;height:clamp(110px,16vw,190px)}
.gate-hills svg{width:100%;height:100%}
.gate-card{position:relative;z-index:1;width:min(440px,100%);background:var(--card);border-radius:32px;padding:clamp(26px,5vw,40px);text-align:center;box-shadow:0 24px 50px -30px rgba(23,56,46,.5);animation:lift 900ms var(--ease) 200ms both}
.gate-card .logo{width:min(280px,80%);margin:0 auto 22px}
.gate-card h1{font-size:clamp(2rem,6vw,2.6rem);margin-bottom:.35em}
.gate-card p{margin:0 0 1.2em;font-size:1rem}
.gate-form{display:grid;gap:12px}
.gate-form input{width:100%;min-height:52px;border:0;border-radius:99px;padding:0 1.3em;font:500 1.05rem var(--sans);color:var(--night);background:#fff;box-shadow:inset 0 0 0 1.5px rgba(23,56,46,.18)}
.gate-form input:focus-visible{box-shadow:inset 0 0 0 2px var(--night);outline:none}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:5.2em}
.gate-form .pw-show{position:absolute;right:7px;top:50%;translate:0 -50%;min-height:38px;padding:0 14px;border:0;border-radius:99px;background:rgba(23,56,46,.08);color:var(--night);font:700 .85rem var(--sans);cursor:pointer}
.gate-form .pw-show:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.gate-form .pw-show:hover{transform:none;background:rgba(23,56,46,.14)}}
.gate-back{display:inline-block;margin-top:6px;font-size:.92rem;font-weight:600;text-underline-offset:3px}
.gate-msg{min-height:1.5em;margin:12px 0 0!important;font-size:.95rem!important;color:var(--rose);font-weight:600}
.gate.is-open{animation:gate-off 700ms var(--ease) forwards}
.gate[hidden]{display:none}

.a-btn,.gate-form button[type=submit]{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:.85em 1.6em;border:0;border-radius:99px;background:var(--rose);color:#fff;font:700 1.02rem/1.1 var(--sans);text-decoration:none;cursor:pointer;transition:transform 180ms var(--ease)}
.a-btn:active,.gate-form button[type=submit]:active{transform:scale(.97)}
.gate-form button[type=submit][disabled]{opacity:.7;cursor:progress}
@media (hover:hover) and (pointer:fine){.a-btn:hover,.gate-form button[type=submit]:hover{transform:translateY(-2px)}}

/* ---------- The page, once open ---------- */
.sealed-page[hidden]{display:none}
.a-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px var(--gut);background:rgba(244,251,236,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.a-top img{height:22px;width:auto;max-width:62vw;object-fit:contain}
.a-top button{border:0;background:none;color:var(--night);font:600 .9rem var(--sans);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 2px;white-space:nowrap;flex:none}

.a-hero{position:relative;text-align:center;padding:clamp(28px,5vw,60px) var(--gut) clamp(140px,16vw,200px);background:linear-gradient(180deg,#CDEFDC,#F4F3C2);overflow:hidden}
.a-hero h1{font-size:clamp(3rem,10vw,7rem)}
.a-sub{max-width:34em;margin:.8em auto 1.8em;font-size:clamp(1.1rem,2vw,1.3rem)}
.a-scroll{position:relative;z-index:1;margin:26px 0 0;font:italic 500 1.1rem var(--serif)}
.a-hero .hills{position:absolute;inset:auto 0 0;height:clamp(90px,13vw,150px);pointer-events:none}
.a-hero .hills svg{width:100%;height:100%}

.film{position:relative;z-index:1;max-width:980px;margin:auto;aspect-ratio:16/9;border-radius:28px;overflow:hidden;background:var(--card);box-shadow:0 26px 60px -34px rgba(23,56,46,.6)}
.film img,.film video,.film iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.film img{filter:brightness(1.06) saturate(.94) contrast(.96)}
.film-play{position:absolute;inset:0;display:grid;place-items:center;border:0;background:none;cursor:pointer}
.film-play span{display:inline-flex;align-items:center;gap:10px;padding:.8em 1.4em;border-radius:99px;background:rgba(255,253,245,.94);font:700 1rem var(--sans);color:var(--night);transition:transform 180ms var(--ease)}
.film-play i{width:0;height:0;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent var(--rose)}
@media (hover:hover) and (pointer:fine){.film-play:hover span{transform:translateY(-2px)}}
.film-soon{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);white-space:nowrap;background:rgba(255,253,245,.94);color:var(--night);font:700 .9rem var(--sans);padding:.6em 1.1em;border-radius:99px}

.a-sec{padding:clamp(70px,10vw,130px) var(--gut);max-width:1180px;margin:auto}
.a-sec > h2{margin-bottom:.6em}
.a-intro{max-width:40em;font-size:clamp(1.1rem,1.8vw,1.25rem)}

.a-story-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr);gap:clamp(30px,6vw,90px);align-items:center}
.a-arch{border-radius:999px 999px 40px 40px;overflow:hidden;box-shadow:0 22px 50px -26px rgba(120,80,50,.45)}
.a-arch img{width:100%;filter:brightness(1.08) saturate(.94) contrast(.95)}
.a-copy h2{margin-bottom:.5em}
.a-lead{font:700 clamp(1.35rem,2.6vw,1.75rem)/1.25 var(--display);letter-spacing:-.02em}
.a-pull{font:italic 500 clamp(1.9rem,5vw,3.4rem)/1.1 var(--serif);color:var(--rose);text-align:center;margin:clamp(50px,7vw,90px) auto!important;max-width:16em}
.a-read{max-width:660px;margin:auto;font-size:1.14rem;line-height:1.65}

.a-show,.a-why{max-width:none;padding-inline:max(var(--gut),calc((100% - 1180px)/2 + var(--gut)));border-radius:40px}
.a-show{background:var(--card)}
.a-themes{list-style:none;padding:0;margin:40px 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.a-themes li{padding:24px;border-radius:24px;background:color-mix(in srgb,var(--c) 22%,#fff)}
.a-themes b{display:inline-block;font:700 .86rem/1 var(--sans);padding:.55em .95em;border-radius:99px;background:var(--c);color:var(--night);margin-bottom:12px}
.a-themes li:nth-child(5) b{color:#fff}
.a-themes span{display:block}
.a-note{font:italic 500 1.25rem/1.35 var(--serif)}

.a-head-guests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,3vw,30px);margin-top:40px}
.g-card{position:relative;background:var(--card);border-radius:32px;padding:clamp(24px,3.5vw,38px);box-shadow:0 20px 44px -32px rgba(23,56,46,.5)}
.g-pic{width:120px;aspect-ratio:1;border-radius:999px 999px 24px 24px;overflow:hidden;margin-bottom:20px}
.g-pic img{width:100%;height:100%;object-fit:cover;filter:brightness(1.06) saturate(.94)}
.g-mono{display:grid;place-items:center;background:linear-gradient(180deg,#CDEFDC,#F4F3C2)}
.g-mono span{font:italic 600 2.4rem var(--serif);color:var(--night)}
.g-tag{position:absolute;top:clamp(24px,3.5vw,38px);right:clamp(24px,3.5vw,38px);margin:0!important;background:var(--butter);font:700 .82rem/1 var(--sans);padding:.55em .9em;border-radius:99px}
.g-card h3{font-size:clamp(1.5rem,2.6vw,2rem);margin-bottom:.3em}
.g-role{font-weight:700;color:var(--rose);line-height:1.4}
.g-ep{font:italic 500 1.15rem/1.3 var(--serif)}
.g-credit{font-size:.75rem;opacity:.6;margin:0!important}
.a-wish{margin-top:clamp(50px,7vw,80px)}
.a-wish-note{margin:.4em 0 1.2em;opacity:.75}
.a-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.a-list li{padding:16px 20px;border-radius:20px;background:rgba(23,56,46,.05)}
.a-list b,.a-list span{display:block}
.a-list span{font-size:.95rem;opacity:.8}

.a-why{background:linear-gradient(180deg,#FFF9CF,#FFEFB8)}
.a-why-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px);margin-top:40px}
.a-why-grid h3{margin-bottom:.5em}

.a-built-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:40px}
.a-built-grid article{background:var(--card);border-radius:28px;padding:clamp(22px,3vw,32px)}
.a-built-grid h3{margin:14px 0 .45em}
.dot{display:block;width:22px;height:22px;border-radius:50%;background:var(--c)}

.a-end{text-align:center;padding-bottom:60px}
.a-end > p:first-of-type{font-size:1.2rem}
.a-mail{margin-top:14px;font-weight:600}
.a-small{margin-top:60px!important;font-size:.85rem;opacity:.6}

/* The name sign: the same family as the hero's sign. The bulbs chase and the name flashes. */
.sign-wrap{position:relative;z-index:1;max-width:900px;margin:0 auto -10px}
.marquee{width:100%;height:auto;overflow:visible}
.marquee .bulbs-a{animation:bulb .5s steps(1) infinite}
.marquee .bulbs-b{animation:bulb .5s steps(1) infinite -.25s}
.marquee .loud-name{animation:loud 1s steps(1) infinite}
.marquee .twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite alternate}
.marquee .t2{animation-delay:-.5s}.marquee .t3{animation-delay:-1s}
@keyframes bulb{0%{opacity:1}50%{opacity:.12}}
@keyframes loud{0%{fill:#FFD15C}50%{fill:#FF9FB8}}
@keyframes twinkle{from{transform:scale(.7);opacity:.6}to{transform:scale(1.1);opacity:1}}

.a-letter{max-width:760px}
.letter{position:relative;background:var(--card);border-radius:28px;padding:clamp(28px,5vw,56px);box-shadow:0 22px 50px -34px rgba(23,56,46,.5);font:400 clamp(1.15rem,2vw,1.3rem)/1.6 var(--sans)}
.letter::before{content:"✦";position:absolute;top:-16px;left:50%;translate:-50% 0;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--butter);font-size:1rem}
.letter-hi,.letter-sign{font:italic 500 clamp(1.6rem,3vw,2.1rem)/1.2 var(--serif);color:var(--rose)}
.letter-sign{margin:1.2em 0 0!important}

.a-quote{text-align:center}
.big-quote{margin:10px auto 0;max-width:980px}
.big-quote p{font:italic 500 clamp(2.3rem,6.4vw,5rem)/1.04 var(--serif);color:var(--rose);margin:0 0 .45em;letter-spacing:-.01em}
.big-quote footer{font-weight:600;font-size:1rem}
.mirror{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(16px,3vw,40px);align-items:center;max-width:820px;margin:clamp(40px,6vw,70px) auto 0;text-align:left}
.mirror > div{background:var(--card);border-radius:24px;padding:24px 26px}
.mirror h3{font-size:1.5rem;margin-bottom:.35em}
.mirror p{margin:0}
.mirror-x{font-size:1.6rem;color:var(--rose)}

.ticket{display:grid;grid-template-columns:1fr 180px;max-width:980px;margin:auto;border-radius:32px;overflow:hidden;background:var(--card);box-shadow:0 26px 60px -36px rgba(23,56,46,.6)}
.ticket-main{padding:clamp(28px,5vw,54px)}
.ox-logo{display:block;width:clamp(170px,22vw,230px);height:auto;margin-bottom:26px}
.ticket-kicker{display:inline-block;background:var(--butter);font:700 .86rem/1 var(--sans);padding:.6em 1em;border-radius:99px;margin-bottom:1em}
.ticket h2{font-size:clamp(2.1rem,5vw,3.8rem);margin-bottom:.45em}
.ticket-when{font:italic 500 1.3rem/1.3 var(--serif);color:var(--rose)}
.ticket-stub{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 12px;background:#002147;color:#fff;text-align:center;border-left:3px dashed var(--card)}
.ticket-stub span{font:700 .8rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--butter)}
.ticket-stub b{font:400 1.45rem/1.15 "Alfa Slab One",serif;writing-mode:vertical-rl;rotate:180deg}

.a-rooms{text-align:center}
.rooms-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:40px;text-align:left}
.rooms-grid blockquote{margin:0;padding:clamp(24px,3.5vw,36px);border-radius:28px;background:linear-gradient(180deg,#CDEFDC,#F4F3C2)}
.rooms-grid blockquote:nth-child(2){background:linear-gradient(180deg,#FFF9CF,#FFEFB8)}
.rooms-grid p{font:italic 500 clamp(1.5rem,2.8vw,2.1rem)/1.2 var(--serif);margin:0 0 .7em}
.rooms-grid footer{font-weight:600;font-size:.95rem}
.a-rooms .a-note{margin-top:30px}

.end-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.a-btn-butter{background:var(--butter);color:var(--night)}

/* One entrance: fade and rise, once */
.js-open .rise{opacity:0;transform:translateY(22px);transition:opacity 700ms var(--ease),transform 900ms var(--ease)}
.js-open .rise.in{opacity:1;transform:none}
.page-in{animation:lift 900ms var(--ease) both}

@keyframes rise{from{transform:translateY(60%)}}
@keyframes lift{from{opacity:0;transform:translateY(40px)}}
@keyframes gate-off{to{opacity:0;visibility:hidden}}

@media (max-width:860px){
  .a-story-grid{grid-template-columns:1fr}
  .a-arch{width:min(380px,86%);margin:auto}
  .a-themes,.a-why-grid{grid-template-columns:1fr 1fr}
  .a-head-guests,.a-list,.a-built-grid,.rooms-grid{grid-template-columns:1fr}
  .mirror{grid-template-columns:1fr;text-align:left}.mirror-x{justify-self:center}
}
@media (max-width:560px){
  .a-themes,.a-why-grid{grid-template-columns:1fr}
  .a-show,.a-why{border-radius:28px}
  .film{border-radius:20px}
  .film-soon{font-size:.8rem}
  .ticket{grid-template-columns:1fr;border-radius:24px}
  .ticket-stub{flex-direction:row;border-left:0;border-top:3px dashed var(--card);padding:18px}
  .ticket-stub b{writing-mode:horizontal-tb;rotate:none;font-size:1.15rem}
  .end-btns .a-btn{width:100%}
  .a-top img{height:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js-open .rise{opacity:1;transform:none}
}
</style>
</head>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const gate = $('[data-gate]'), form = $('[data-gate-form]'), msg = $('[data-gate-msg]'), page = $('[data-page]'), content = $('[data-content]');
  const sealed = JSON.parse($('#sealed').textContent);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const KEY = 'abh-agent';
  const remember = { get() { try { return sessionStorage.getItem(KEY); } catch { return null; } }, set(v) { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch { /* this visit only */ } } };

  // The key comes from the email and the password together, so both are needed.
  const secret = (em, pw) => `${em.trim().toLowerCase()}\n${pw}`;
  async function unseal(pw) {
    if (!sealed.data) throw new Error('unsealed');
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(sealed.salt), iterations: sealed.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(sealed.iv) }, key, b64(sealed.data));
    return new TextDecoder().decode(plain);
  }

  const hills = '<div class="hills" aria-hidden="true"><svg viewBox="0 0 1600 150" preserveAspectRatio="xMidYMax slice"><path d="M0 92C260 40 520 60 800 88S1320 110 1600 66V150H0Z" fill="#BFE3C8"/><rect x="1367.75" y="59.4" width="4.5" height="30.6" fill="#5E7A6C"/><circle cx="1370" cy="45" r="22.5" fill="#BBB2E6"/><circle cx="1356.5" cy="57.6" r="13.5" fill="#BBB2E6"/><circle cx="1383.5" cy="57.6" r="13.5" fill="#BBB2E6"/><path d="M0 116C300 84 620 124 900 110S1360 92 1600 118V150H0Z" fill="#FFF6E6"/></svg></div>';

  function film(root) {
    const el = $('.film', root);
    if (!el) return;
    const yt = el.dataset.youtube, src = el.dataset.src, poster = el.dataset.poster;
    if (src) { el.innerHTML = `<video controls playsinline preload="metadata" poster="${poster}" src="${src}"></video>`; return; }
    if (yt) {
      el.insertAdjacentHTML('beforeend', '<button class="film-play" type="button" aria-label="Play Abigail’s film"><span><i></i>Play her film</span></button>');
      $('.film-play', el).addEventListener('click', () => {
        el.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(yt)}?autoplay=1&rel=0&modestbranding=1" title="Abigail’s film" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
      }, { once: true });
      return;
    }
    el.insertAdjacentHTML('beforeend', '<p class="film-soon">Her film is on its way</p>');
  }

  function open(html, instant) {
    content.innerHTML = html;
    $('.a-hero', content)?.insertAdjacentHTML('beforeend', hills);
    film(content);
    document.documentElement.classList.add('js-open');
    page.hidden = false;
    page.classList.add('page-in');
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
    content.querySelectorAll('.rise').forEach((el) => io.observe(el));
    if (instant) gate.hidden = true;
    else { gate.classList.add('is-open'); setTimeout(() => { gate.hidden = true; }, 700); }
    scrollTo(0, 0);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!form.em.value.trim() || !form.pw.value) { msg.textContent = 'Both your email and password, please.'; return; }
    const pw = secret(form.em.value, form.pw.value);
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Checking…'; msg.textContent = '';
    try { open(await unseal(pw)); remember.set(pw); }
    catch (err) { msg.textContent = err.message === 'unsealed' ? 'This page hasn’t been sealed yet.' : 'That email and password don’t match. Try again?'; form.pw.select(); }
    finally { btn.disabled = false; btn.textContent = 'Let me in'; }
  });

  $('[data-lock]').addEventListener('click', () => { remember.set(null); form.reset(); location.reload(); });
  $('[data-show]').addEventListener('click', (e) => {
    const on = form.pw.type === 'password';
    form.pw.type = on ? 'text' : 'password';
    e.currentTarget.textContent = on ? 'Hide' : 'Show';
    e.currentTarget.setAttribute('aria-pressed', String(on));
    form.pw.focus();
  });

  const saved = remember.get();
  if (saved) unseal(saved).then((h) => open(h, true)).catch(() => remember.set(null));
})();
</script>
</body>
</html>
